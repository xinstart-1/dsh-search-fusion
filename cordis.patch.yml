# Register the search-fusion provider and switch the web capability search
# channel to it.
#
# IMPORTANT — loader patch semantics: a patch REPLACES the targeted row's whole
# `config` object; it does not merge into it. That is why `fetchProvider` is
# restated here: leaving it out silently drops the `fetchProvider: http` that
# @deepseek-ai/dsh-base sets, which makes the two registered fetch providers
# (`http`, `deepseek-fetch-api`) ambiguous and turns every web_fetch call into
# "multiple usable web providers are registered (...); configure one
# explicitly" (WEB_PROVIDER_AMBIGUOUS).
#
# `http` is the dsh-base default (local fetcher). Users who prefer the DeepSeek
# Fetch API should override it in their own higher layer — the profile
# cordis.patch.yml or $DSH_HOME/cordis.patch.yml wins because layers apply in
# order and the last write wins:
#
#   - id: web
#     config:
#       searchProvider: fusion
#       fetchProvider: deepseek-fetch-api
- id: web
  config:
    searchProvider: fusion
    fetchProvider: http

- insert:
    - id: dsh-search-fusion
      name: dsh-search-fusion
      config:
        primary: bing
        strategy: fusion
        # User-defined JSON engines can also be declared here (Settings page is
        # the friendlier way). apiKeyEnv is a CREDENTIAL REFERENCE (env-var name),
        # never the secret itself. See README "自定义搜索引擎".
        # customEngines:
        #   - id: myapi
        #     label: My Search API
        #     url: https://api.example.com/v1/search?q={query}&limit={maxResults}
        #     method: GET
        #     apiKeyEnv: MY_SEARCH_KEY
        #     authHeader: 'X-API-Key: {key}'
        #     resultsPath: data.results
        #     urlField: link
        #     titleField: name
        #     snippetField: content
